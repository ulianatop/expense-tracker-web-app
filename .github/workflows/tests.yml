name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: expenses-tracker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expenses-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          cat > server/state/database/.env.test << 'EOF'
          MYSQL_HOST=127.0.0.1
          MYSQL_USER=root
          MYSQL_PASSWORD=root
          MYSQL_DATABASE=expenses_test
          JWT_SECRET=github_actions_test_secret
          EOF

      - name: Run tests
        run: npm test