<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" type="module"></script>
</head>

<body>
    <header>
        <div class="header-content">
            <h1>Expense Tracker</h1>

            <nav>
                <ul>
                    <li><a class="active" href="/expenses/expenses.html">Expenses</a></li>
                    <li><a href="/categories/categories.html">Categories</a></li>
                </ul>

                <button id="logoutButton">Logout</button>
            </nav>
        </div>
    </header>

    <main>
        <h2>Expenses</h2>
        <p class="page-description">Add and manage your expenses below.</p>

        <section id="inputSection">
            <input type="date" id="txnDate" required>

            <input
                type="text"
                id="txnDesc"
                placeholder="Description"
                minlength="1"
                required
            >

            <select id="txnCat"></select>

            <input
                type="number"
                id="txnAmt"
                min="0"
                step="0.01"
                placeholder="Amount"
                required
            >

            <button id="addButton">Add Transaction</button>
            <button id="cancelButton" style="display:none">Cancel</button>
        </section>

        <section id="txnList"></section>
    </main>
</body>

</html>
